<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Christmas Tree 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080a10;
      color: #c8d2e6;
      font-family: Consolas, Menlo, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      background: #080a10;
      cursor: grab;
      max-width: 100%;
      max-height: 100%;
    }
    canvas:active {
      cursor: grabbing;
    }
    #controls {
      position: fixed;
      bottom: 14px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
      opacity: 0.75;
      transition: opacity 0.2s;
    }
    #controls:hover {
      opacity: 1;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      color: #d0daf0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 6px 11px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: rgba(255, 196, 90, 0.2);
      border-color: #ffc45a;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="screen"></canvas>
    <div id="controls">
      <button id="btnPause">Space: Pause</button>
      <button id="btnRestart">R: Restart</button>
      <button id="btnSave">S: Save PNG</button>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("screen");
      const ctx = canvas.getContext("2d");

      // ==========================================
      // 1. CẤU HÌNH LƯỚI ASCII & THÔNG SỐ HIỂN THỊ
      // ==========================================
      const COLS = 96;
      const ROWS = 74;
      const CW = 9;
      const CH = 14;
      const FONT_PX = 14;
      const MESSAGE = "M E R R Y   C H R I S T M A S   2 0 2 6";
      const WATERMARK = "@ascii.christmas";
      const RAMP = " .:-~=+*x%&#WM";
      const TAU = Math.PI * 2;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = COLS * CW * dpr;
      canvas.height = ROWS * CH * dpr;
      ctx.scale(dpr, dpr);

      // Tự động co giãn vừa khung hình điện thoại / máy tính
      function fitCanvas() {
        const scale = Math.min(
          window.innerWidth / (COLS * CW),
          window.innerHeight / (ROWS * CH)
        );
        canvas.style.width = `${Math.floor(COLS * CW * scale)}px`;
        canvas.style.height = `${Math.floor(ROWS * CH * scale)}px`;
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      // ==========================================
      // 2. HÀM TOÁN HỌC & SINH SỐ NGẪU NHIÊN
      // ==========================================
      let seed = 7;
      function rand() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      }
      function uniform(a, b) {
        return a + (b - a) * rand();
      }
      function gauss() {
        let u = 0, v = 0;
        while (u === 0) u = rand();
        while (v === 0) v = rand();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(TAU * v);
      }
      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }
      function smoothstep(x) {
        const t = clamp(x, 0, 1);
        return t * t * (3 - 2 * t);
      }
      function normalize(x, y, z) {
        const len = Math.hypot(x, y, z) || 1;
        return [x / len, y / len, z / len];
      }

      // Phân bố điểm đều trên mặt cầu (Fibonacci Sphere) cho quả châu & bóng đèn
      function fibSphere(n) {
        const pts = [];
        const golden = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / (n - 1)) * 2;
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const theta = golden * i;
          pts.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
        }
        return pts;
      }

      // ==========================================
      // 3. XÂY DỰNG MÔ HÌNH 3D CÂY THÔNG & PHỤ KIỆN
      // ==========================================
      const GROUND = -1.0;
      const Y0 = -0.68;
      const Y1 = 1.05;

      // Mốc thời gian xuất hiện từng phần (giây)
      const T_GROW = [1.0, 4.6];     // Cây mọc từ ngọn xuống gốc
      const T_GARLAND = [4.8, 7.2];  // Dây kim tuyến quấn quanh
      const T_BALLS = [6.2, 8.4];    // Quả châu trang trí
      const T_LIGHTS = [7.8, 10.4];  // Đèn nháy đầu cành
      const T_GIFTS = [10.0, 12.0];  // Hộp quà dưới gốc
      const T_STAR = 12.0;           // Ngôi sao đỉnh cây
      const T_MSG = 13.4;            // Dòng chữ Merry Christmas

      function envelope(y) {
        const u = clamp((y - Y0) / (Y1 - Y0), 0, 1);
        return 0.78 * Math.pow(1 - u, 0.82) + 0.03;
      }

      // Mọc từ trên ngọn (Y1) xuống dưới gốc (GROUND)
      function growTime(y) {
        const u = clamp((Y1 - y) / (Y1 - GROUND), 0, 1);
        return T_GROW[0] + (T_GROW[1] - T_GROW[0]) * u;
      }

      // Bảng màu RGB (0..1)
      const WHITE = [0.96, 0.98, 1.0];
      const TRUNK_COL = [0.45, 0.28, 0.15];
      const GOLD = [1.0, 0.84, 0.25];
      const RED = [0.96, 0.18, 0.22];
      const GREEN_BOX = [0.16, 0.75, 0.34];
      const BLUE_BOX = [0.22, 0.52, 0.96];
      const WARM = [1.0, 0.93, 0.68];

      // Danh sách điểm 3D & Sao nền
      let points = [];
      let groundPts = [];
      let stars = [];
      let totalLights = 0;

      function addPoint(x, y, z, nx, ny, nz, col, kind, t0, base = 1.0, phase = 0, cx = x, cy = y, cz = z, pop = false) {
        points.push({
          x, y, z,
          nx, ny, nz,
          r: col[0], g: col[1], b: col[2],
          kind, t0, base, phase,
          cx, cy, cz, pop
        });
      }

      function buildScene() {
        seed = 7;
        points = [];
        groundPts = [];
        stars = [];
        const tips = [];

        // A. Bầu trời sao nền
        for (let i = 0; i < 230; i++) {
          stars.push({
            col: Math.floor(rand() * COLS),
            row: Math.floor(rand() * (ROWS - 14)),
            ch: rand() < 0.25 ? "+" : rand() < 0.6 ? "*" : ".",
            phase: rand() * TAU,
            speed: uniform(1.5, 4.0)
          });
        }

        // B. Mặt sàn chấm tròn xoay cùng cây
        for (let gx = -2.5; gx <= 2.5; gx += 0.17) {
          for (let gz = -2.5; gz <= 2.5; gz += 0.17) {
            if (Math.hypot(gx, gz) <= 2.55) {
              groundPts.push({ x: gx, y: GROUND, z: gz });
            }
          }
        }

        // C. Tán lá thông nhiều tầng rủ xuống + Tuyết bám đầu cành
        const whorls = 24;
        for (let i = 0; i < whorls; i++) {
          const y = Y0 + 0.02 + ((Y1 - 0.06 - (Y0 + 0.02)) * i) / (whorls - 1);
          const u = (y - Y0) / (Y1 - Y0);
          const R = envelope(y) + 0.05;
          const nb = Math.floor(6 + 12 * (1 - u));

          for (let b = 0; b < nb; b++) {
            const a = (TAU * (b + 0.5 * rand())) / nb + i * 0.77;
            const L = R * uniform(0.85, 1.08);
            const n = Math.floor(25 + 250 * L);
            const dx = Math.cos(a), dz = Math.sin(a);
            const sx = -Math.sin(a), sz = Math.cos(a);

            for (let k = 0; k < n; k++) {
              const s = Math.pow(rand(), 0.65);
              const spread = (0.025 + 0.09 * s) * gauss();
              const sl = s * L;

              const px = dx * sl + sx * spread;
              const py = y + 0.06 * sl - 0.20 * sl * sl + 0.012 * gauss();
              const pz = dz * sl + sz * spread;

              const [nx, ny, nz] = normalize(
                dx * 0.75 + 0.3 * gauss(),
                0.55 + 0.3 * gauss(),
                dz * 0.75 + 0.3 * gauss()
              );
              const ao = (0.32 + 0.70 * Math.pow(s, 1.3)) * uniform(0.75, 1.1);
              const isSnow = s > 0.52 && rand() < 0.08 * s && ny > 0.45;

              const col = isSnow
                ? WHITE
                : [
                    0.09 + 0.12 * rand(),
                    0.46 + 0.36 * rand(),
                    0.16 + 0.14 * rand()
                  ];

              addPoint(
                px, py, pz,
                nx, ny, nz,
                col,
                isSnow ? "SNOW" : "NEEDLE",
                growTime(y) + 0.45 * s,
                isSnow ? 1.0 : ao
              );
            }

            // Lưu tọa độ đầu cành để gắn đèn nháy
            const tl = 0.93 * L;
            tips.push([
              dx * tl,
              y + 0.06 * tl - 0.20 * tl * tl,
              dz * tl
            ]);
          }
        }

        // D. Lõi nón tối bên trong để che các cành mặt sau không bị xuyên thấu
        const innerCount = 5500;
        for (let i = 0; i < innerCount; i++) {
          const y = Y0 + (Y1 - 0.1 - Y0) * rand();
          const phi = rand() * TAU;
          const r = 0.58 * envelope(y);
          const [nx, ny, nz] = normalize(Math.cos(phi), 0.3, Math.sin(phi));
          addPoint(
            Math.cos(phi) * r, y, Math.sin(phi) * r,
            nx, ny, nz,
            [0.03, 0.14, 0.06],
            "CORE",
            growTime(y) + 0.2,
            0.45
          );
        }

        // E. Thân cây thông
        const trunkCount = 1400;
        for (let i = 0; i < trunkCount; i++) {
          const y = GROUND + rand() * (Y0 + 0.1 - GROUND);
          const phi = rand() * TAU;
          const nx = Math.cos(phi), nz = Math.sin(phi);
          const bark = 0.75 + 0.25 * Math.sign(Math.sin(phi * 30 + y * 5));
          addPoint(
            nx * 0.085, y, nz * 0.085,
            nx, 0, nz,
            TRUNK_COL,
            "TRUNK",
            growTime(y),
            bark
          );
        }

        // F. Dây kim tuyến vàng quấn xoắn ốc võng xuống
        const garlandSteps = 2400;
        const turns = 3.6;
        for (let i = 0; i < garlandSteps; i++) {
          const u = i / (garlandSteps - 1);
          const yg = Y0 + 0.14 + (Y1 - Y0 - 0.42) * u;
          const ag = TAU * turns * u + 0.9;
          const swag = -0.065 * Math.abs(Math.sin(ag * 2.5));
          const rg = envelope(yg) + 0.07;

          for (let j = 0; j < 3; j++) {
            const [nx, ny, nz] = normalize(
              Math.cos(ag) + 0.4 * gauss(),
              0.3 + 0.4 * gauss(),
              Math.sin(ag) + 0.4 * gauss()
            );
            addPoint(
              Math.cos(ag) * rg + 0.015 * gauss(),
              yg + swag + 0.015 * gauss(),
              Math.sin(ag) * rg + 0.015 * gauss(),
              nx, ny, nz,
              GOLD,
              "TINSEL",
              T_GARLAND[0] + u * (T_GARLAND[1] - T_GARLAND[0]),
              0.95,
              rand() * TAU
            );
          }
        }

        // G. Quả châu đỏ & vàng xen kẽ
        const sphere = fibSphere(140);
        const numBaubles = 34;
        for (let k = 0; k < numBaubles; k++) {
          const u = (k + rand()) / numBaubles;
          const y = Y0 + 0.08 + u * (Y1 - Y0 - 0.36);
          const a = k * 2.39996 + rand() * 0.4;
          const rEnv = envelope(y);
          const cx = Math.cos(a) * rEnv;
          const cy = y - 0.03;
          const cz = Math.sin(a) * rEnv;
          const rad = 0.056 + 0.03 * (1 - u);
          const col = k % 2 === 0 ? RED : GOLD;
          const t0 = T_BALLS[0] + rand() * (T_BALLS[1] - T_BALLS[0]);

          for (const [sx, sy, sz] of sphere) {
            addPoint(
              cx + sx * rad, cy + sy * rad, cz + sz * rad,
              sx, sy, sz,
              col,
              "BALL",
              t0,
              1.0,
              0,
              cx, cy, cz,
              true
            );
          }
        }

        // H. Đèn nháy trên đầu các nhánh lá
        const bulb = fibSphere(14);
        // Xáo trộn mảng tips
        for (let i = tips.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [tips[i], tips[j]] = [tips[j], tips[i]];
        }
        const pickedTips = tips.slice(0, Math.min(170, tips.length));
        totalLights = pickedTips.length;

        for (const [cx, cy, cz] of pickedTips) {
          const t0 = T_LIGHTS[0] + rand() * (T_LIGHTS[1] - T_LIGHTS[0]);
          const col = rand() < 0.78 ? WARM : [1.0, 0.96, 0.88];
          const phase = rand() * TAU;

          for (const [bx, by, bz] of bulb) {
            addPoint(
              cx + bx * 0.026, cy + by * 0.026, cz + bz * 0.026,
              bx, by, bz,
              col,
              "LIGHT",
              t0,
              1.0,
              phase,
              cx, cy, cz,
              true
            );
          }
        }

        // I. Các hộp quà thắt nơ dưới gốc cây
        const gifts = [
          { a: 0.3, dist: 0.62, w: 0.28, h: 0.22, d: 0.26, rot: 0.4, body: RED, rib: GOLD },
          { a: 1.5, dist: 0.68, w: 0.25, h: 0.28, d: 0.25, rot: 0.2, body: GOLD, rib: RED },
          { a: 2.6, dist: 0.60, w: 0.32, h: 0.18, d: 0.25, rot: 1.0, body: GREEN_BOX, rib: RED },
          { a: 3.8, dist: 0.66, w: 0.28, h: 0.26, d: 0.28, rot: 0.1, body: BLUE_BOX, rib: GOLD },
          { a: 5.1, dist: 0.64, w: 0.24, h: 0.20, d: 0.24, rot: 0.7, body: RED, rib: WHITE }
        ];
        const bowSphere = fibSphere(60);

        gifts.forEach((g, idx) => {
          const gx = Math.cos(g.a) * g.dist;
          const gz = Math.sin(g.a) * g.dist;
          const cosR = Math.cos(g.rot), sinR = Math.sin(g.rot);
          const t0 = T_GIFTS[0] + (idx / gifts.length) * (T_GIFTS[1] - T_GIFTS[0]);
          const ptsOnBox = 1400;

          for (let i = 0; i < ptsOnBox; i++) {
            const face = Math.floor(rand() * 5); // 0: mặt trên, 1..4: 4 mặt bên
            const fa = rand() - 0.5;
            const fb = rand() - 0.5;
            let lx, ly, lz, nx, ny, nz, isRib;

            if (face === 0) {
              lx = fa * g.w; ly = g.h; lz = fb * g.d;
              nx = 0; ny = 1; nz = 0;
              isRib = Math.abs(lx) < 0.024 || Math.abs(lz) < 0.024;
            } else if (face === 1) {
              lx = g.w / 2; ly = (fb + 0.5) * g.h; lz = fa * g.d;
              nx = 1; ny = 0; nz = 0;
              isRib = Math.abs(lz) < 0.024;
            } else if (face === 2) {
              lx = -g.w / 2; ly = (fb + 0.5) * g.h; lz = fa * g.d;
              nx = -1; ny = 0; nz = 0;
              isRib = Math.abs(lz) < 0.024;
            } else if (face === 3) {
              lx = fa * g.w; ly = (fb + 0.5) * g.h; lz = g.d / 2;
              nx = 0; ny = 0; nz = 1;
              isRib = Math.abs(lx) < 0.024;
            } else {
              lx = fa * g.w; ly = (fb + 0.5) * g.h; lz = -g.d / 2;
              nx = 0; ny = 0; nz = -1;
              isRib = Math.abs(lx) < 0.024;
            }

            const wx = gx + lx * cosR - lz * sinR;
            const wy = GROUND + ly;
            const wz = gz + lx * sinR + lz * cosR;
            const rnx = nx * cosR - nz * sinR;
            const rnz = nx * sinR + nz * cosR;

            addPoint(
              wx, wy, wz,
              rnx, ny, rnz,
              isRib ? g.rib : g.body,
              "GIFT",
              t0,
              0.95,
              0,
              gx, GROUND + g.h * 0.5, gz,
              true
            );
          }

          // Nơ trên nắp hộp quà
          for (const [bx, by, bz] of bowSphere) {
            addPoint(
              gx + bx * 0.055,
              GROUND + g.h + 0.025 + by * 0.03,
              gz + bz * 0.055,
              bx, by, bz,
              g.rib,
              "GIFT",
              t0 + 0.15,
              1.0,
              0,
              gx, GROUND + g.h, gz,
              true
            );
          }
        });
      }

      buildScene();

      // ==========================================
      // 4. PHÉP CHIẾU 3D -> 2D & VẼ NGÔI SAO ĐỈNH
      // ==========================================
      const camZ = 2.95;
      const sinP = Math.sin(0.11);
      const cosP = Math.cos(0.11);
      const fov = 1.72;
      const aspect = CH / CW;

      function project(x, y, z, cosA, sinA) {
        const rx = x * cosA - z * sinA;
        const rz = x * sinA + z * cosA;
        const cy = y + 0.14;
        const cz = rz + camZ;

        const py = cy * cosP - cz * sinP;
        const pz = cy * sinP + cz * cosP;
        if (pz <= 0.25) return null;

        const sx = COLS * 0.5 + (rx / pz) * fov * (ROWS * 0.5) * aspect;
        const sy = ROWS * 0.5 - (py / pz) * fov * (ROWS * 0.5);
        return { sx, sy, pz };
      }

      // Vẽ ngôi sao 3D phát sáng trên đỉnh cây
      function drawStar(charGrid, colorGrid, zBuf, cx, cy, scale, flash) {
        const R = scale * 1.75;       // Chiều cao từ tâm ra đỉnh cánh
        const rIn = R * 0.40;          // Độ sâu hõm trong tạo 5 cánh nhọn rõ rệt
        const stretchX = 1.95;         // Bù tỷ lệ chiều rộng ký tự ASCII
        const sector = TAU / 5;
        const halfSector = Math.PI / 5;
        const sinHalf = Math.sin(halfSector);

        const maxDy = Math.ceil(R + 1);
        const maxDx = Math.ceil(R * stretchX + 2);

        for (let dy = -maxDy; dy <= maxDy; dy++) {
          for (let dx = -maxDx; dx <= maxDx; dx++) {
            const nx = dx / stretchX;
            const ny = dy;
            const d = Math.hypot(nx, ny);

            // Góc tính từ đỉnh trên cùng (-PI/2) hướng thẳng lên trên
            const ang = Math.atan2(ny, nx) + Math.PI / 2;
            const wrapped = ((ang % sector) + sector) % sector;
            const phi = Math.abs(wrapped - halfSector);

            // Phương trình biên cạnh thẳng của ngôi sao 5 cánh
            const rStar = (R * rIn * sinHalf) / (rIn * Math.sin(halfSector - phi) + R * Math.sin(phi));

            // Hiệu ứng tia lóe nhẹ lúc ngôi sao vừa bật sáng
            const isFlare = flash > 0.08 && (
              (dy === 0 && Math.abs(dx) <= maxDx + 1) ||
              (dx === 0 && Math.abs(dy) <= maxDy + 1)
            );

            if (d <= rStar || isFlare) {
              const col = Math.round(cx + dx);
              const row = Math.round(cy + dy);
              if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
                const idx = row * COLS + col;
                zBuf[idx] = 0.1;

                const ratio = d / Math.max(rStar, 0.001);
                let ch;
                if (d > rStar) {
                  ch = "+";
                } else if (ratio < 0.36) {
                  ch = "@";
                } else if (ratio < 0.72) {
                  ch = "#";
                } else if (ratio < 0.90) {
                  ch = "*";
                } else {
                  ch = (ny > 0.2 && Math.abs(nx) > 1.2) ? "+" : "*";
                }

                charGrid[idx] = ch;

                if (ch === "@") {
                  colorGrid[idx] = "rgb(255, 252, 210)";
                } else if (ch === "#") {
                  const g = Math.min(255, Math.round(215 + 35 * flash));
                  colorGrid[idx] = `rgb(255, ${g}, 85)`;
                } else {
                  const g = Math.min(255, Math.round(195 + 45 * flash));
                  colorGrid[idx] = `rgb(255, ${g}, 60)`;
                }
              }
            }
          }
        }
      }

      // ==========================================
      // 5. VÒNG LẶP RENDER CHÍNH & TƯƠNG TÁC
      // ==========================================
      let elapsed = 0;
      let angle = 0;
      let paused = false;
      let dragging = false;
      let lastMouseX = 0;
      let lastTime = performance.now();

      // Hỗ trợ kéo chuột & vuốt cảm ứng để xoay tự do
      canvas.addEventListener("pointerdown", (e) => {
        dragging = true;
        lastMouseX = e.clientX;
      });
      window.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastMouseX;
        lastMouseX = e.clientX;
        angle += dx * 0.01;
      });
      window.addEventListener("pointerup", () => {
        dragging = false;
      });

      function togglePause() {
        paused = !paused;
        document.getElementById("btnPause").textContent = paused ? "Space: Play" : "Space: Pause";
      }
      function restartScene() {
        elapsed = 0;
        angle = 0;
        paused = false;
        document.getElementById("btnPause").textContent = "Space: Pause";
      }
      function saveScreenshot() {
        const link = document.createElement("a");
        link.download = "ascii-christmas-tree.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      document.getElementById("btnPause").onclick = togglePause;
      document.getElementById("btnRestart").onclick = restartScene;
      document.getElementById("btnSave").onclick = saveScreenshot;

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          togglePause();
        } else if (e.key === "r" || e.key === "R") {
          restartScene();
        } else if (e.key === "s" || e.key === "S") {
          saveScreenshot();
        }
      });

      const zBuf = new Float32Array(COLS * ROWS);
      const charGrid = new Array(COLS * ROWS);
      const colorGrid = new Array(COLS * ROWS);

      // Hướng ánh sáng chính
      const [LX, LY, LZ] = normalize(0.55, 0.72, -0.45);

      function render(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        if (!paused) {
          elapsed += dt;
          if (!dragging) {
            // Tốc độ xoay tròn ~22 độ/giây
            angle = (angle + dt * 0.38) % TAU;
          }
        }

        // Xóa buffer
        zBuf.fill(999);
        charGrid.fill("");
        colorGrid.fill("");

        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);

        // 1. Vẽ bầu trời sao nhấp nháy
        for (const st of stars) {
          const twinkle = 0.5 + 0.5 * Math.sin(elapsed * st.speed + st.phase);
          if (twinkle > 0.25) {
            const idx = st.row * COLS + st.col;
            charGrid[idx] = twinkle > 0.82 ? st.ch : ".";
            const b = Math.round(90 + 130 * twinkle);
            colorGrid[idx] = `rgb(${b},${b + 10},${Math.min(255, b + 35)})`;
          }
        }

        // 2. Vẽ mặt sàn lưới chấm xoay tròn
        for (const gp of groundPts) {
          const p = project(gp.x, gp.y, gp.z, cosA, sinA);
          if (!p) continue;
          const col = Math.round(p.sx);
          const row = Math.round(p.sy);
          if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
            const idx = row * COLS + col;
            if (p.pz < zBuf[idx]) {
              zBuf[idx] = p.pz;
              charGrid[idx] = ".";
              const shade = Math.round(clamp(135 - p.pz * 22, 35, 95));
              colorGrid[idx] = `rgb(${shade},${shade + 8},${shade + 22})`;
            }
          }
        }

        // 3. Chiếu toàn bộ điểm 3D của cây thông & phụ kiện
        let activeLights = 0;
        const lightRatio = clamp((elapsed - T_LIGHTS[0]) / (T_LIGHTS[1] - T_LIGHTS[0]), 0, 1);
        activeLights = Math.round(totalLights * lightRatio);

        for (let i = 0; i < points.length; i++) {
          const pt = points[i];
          if (elapsed < pt.t0) continue;

          // Hiệu ứng bung nở (pop-in) cho quả châu, đèn, hộp quà
          let px = pt.x, py = pt.y, pz = pt.z;
          if (pt.pop) {
            const age = (elapsed - pt.t0) / 0.35;
            if (age < 1) {
              const s = smoothstep(age);
              px = pt.cx + (pt.x - pt.cx) * s;
              py = pt.cy + (pt.y - pt.cy) * s;
              pz = pt.cz + (pt.z - pt.cz) * s;
            }
          }

          const proj = project(px, py, pz, cosA, sinA);
          if (!proj) continue;

          const col = Math.round(proj.sx);
          const row = Math.round(proj.sy);
          if (col < 0 || col >= COLS || row < 0 || row >= ROWS) continue;

          const idx = row * COLS + col;
          if (proj.pz >= zBuf[idx]) continue;

          zBuf[idx] = proj.pz;

          // Xoay vector pháp tuyến để tính đổ bóng 3D
          const rnx = pt.nx * cosA - pt.nz * sinA;
          const rnz = pt.nx * sinA + pt.nz * cosA;
          const diff = Math.max(0, rnx * LX + pt.ny * LY + rnz * LZ);

          let lum = pt.base * (0.28 + 0.82 * diff);
          let ch = RAMP[Math.min(RAMP.length - 1, Math.floor(clamp(lum, 0, 0.999) * RAMP.length))];

          // Xử lý phát sáng riêng cho đèn nháy và dây kim tuyến
          if (pt.kind === "LIGHT") {
            const pulse = 0.65 + 0.35 * Math.sin(elapsed * 5.0 + pt.phase);
            lum = 0.75 + 0.35 * pulse;
            ch = pulse > 0.75 ? "@" : "o";
          } else if (pt.kind === "TINSEL") {
            const shimmer = 0.8 + 0.25 * Math.sin(elapsed * 4.0 + pt.phase);
            lum = clamp(lum * shimmer + 0.25, 0, 1);
            ch = lum > 0.65 ? "#" : "*";
          } else if (pt.kind === "CORE") {
            ch = ".";
          }

          const intensity = 0.35 + 0.78 * clamp(lum, 0, 1.15);
          const r = Math.min(255, Math.round(pt.r * 255 * intensity));
          const g = Math.min(255, Math.round(pt.g * 255 * intensity));
          const b = Math.min(255, Math.round(pt.b * 255 * intensity));

          charGrid[idx] = ch;
          colorGrid[idx] = `rgb(${r},${g},${b})`;
        }

        // 4. Vẽ ngôi sao trên đỉnh cây
        if (elapsed >= T_STAR) {
          const on = smoothstep((elapsed - T_STAR) / 0.35);
          const flash = Math.pow(clamp(1 - (elapsed - T_STAR) / 1.0, 0, 1), 2);
          const starProj = project(0, Y1 + 0.11, 0, cosA, sinA);
          if (starProj) {
            const starScale = (1.1 + 0.8 * on) * (1 + 0.06 * Math.sin(elapsed * 6));
            drawStar(charGrid, colorGrid, zBuf, starProj.sx, starProj.sy, starScale, flash);
          }
        }

        // 5. Vẽ dòng chữ MERRY CHRISTMAS 2026 ở phía dưới
        if (elapsed > T_MSG) {
          const msgRow = ROWS - 9;
          const x0 = Math.floor((COLS - MESSAGE.length) / 2);
          const shown = Math.min(MESSAGE.length, Math.floor((elapsed - T_MSG) * 14));

          // Xóa một dải ngang để chữ nổi bật rõ ràng
          for (let r = msgRow - 1; r <= msgRow + 1; r++) {
            for (let c = Math.max(0, x0 - 2); c < Math.min(COLS, x0 + shown + 2); c++) {
              charGrid[r * COLS + c] = "";
            }
          }

          const palette = [
            [255, 75, 85],
            [255, 210, 75],
            [75, 220, 115]
          ];
          for (let i = 0; i < shown; i++) {
            const ch = MESSAGE[i];
            if (ch !== " ") {
              const tint = palette[(Math.floor(i / 2) + Math.floor(elapsed * 1.8)) % 3];
              const glow = 0.82 + 0.18 * Math.sin(elapsed * 5 + i * 0.4);
              const idx = msgRow * COLS + (x0 + i);
              charGrid[idx] = ch;
              colorGrid[idx] = `rgb(${Math.round(tint[0] * glow)},${Math.round(tint[1] * glow)},${Math.round(tint[2] * glow)})`;
            }
          }
        }

        // 6. Vẽ toàn bộ lưới ký tự lên Canvas
        ctx.fillStyle = "#080a10";
        ctx.fillRect(0, 0, COLS * CW, ROWS * CH);

        ctx.font = `bold ${FONT_PX}px Consolas, Menlo, "Courier New", monospace`;
        ctx.textBaseline = "top";

        let letterCount = 0;
        let lastColor = "";

        for (let r = 0; r < ROWS; r++) {
          const py = r * CH;
          for (let c = 0; c < COLS; c++) {
            const idx = r * COLS + c;
            const ch = charGrid[idx];
            if (!ch) continue;
            letterCount++;
            const colStr = colorGrid[idx];
            if (colStr !== lastColor) {
              ctx.fillStyle = colStr;
              lastColor = colStr;
            }
            ctx.fillText(ch, c * CW, py);
          }
        }

        // 7. Vẽ thông số HUD (góc trên phải & góc dưới trái)
        ctx.font = `12px Consolas, Menlo, "Courier New", monospace`;
        ctx.fillStyle = "#ffc45a";
        const timeText = `• t ${elapsed.toFixed(2).padStart(5, "0")}s`;
        ctx.fillText(timeText, (COLS - timeText.length - 2) * CW, 10);

        const deg = (((angle * 180) / Math.PI) % 360 + 360) % 360;
        ctx.fillStyle = "#b0a8c4";
        ctx.fillText(WATERMARK, 2 * CW, (ROWS - 5.2) * CH);
        ctx.fillStyle = "#7a859e";
        ctx.fillText(
          `rotation ${deg.toFixed(2).padStart(6, "0")}°    lights  ${activeLights}`,
          2 * CW,
          (ROWS - 3.8) * CH
        );
        ctx.fillText(
          `letters ${letterCount.toLocaleString("en-US")}`,
          2 * CW,
          (ROWS - 2.4) * CH
        );

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
